<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient: Subtle deep obsidian to dark space -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0A0B0E" />
      <stop offset="100%" stop-color="#030305" />
    </radialGradient>

    <!-- Subtle Drop Shadow for depth -->
    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#FFFFFF" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Base Circle Container -->
  <rect width="512" height="512" rx="140" fill="url(#bg-glow)" />

  <!-- The "Nexus Wave" (Solid White) -->
  <g filter="url(#subtle-glow)">
    <path d="M 172 340 
             C 172 230, 214 172, 256 256 
             C 298 340, 340 282, 340 172" 
          stroke="#FFFFFF" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
